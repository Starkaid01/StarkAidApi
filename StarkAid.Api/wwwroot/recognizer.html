
<!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>Jarvis Speech</title>
        <link rel="stylesheet" href="global.css" type="text/css" media="screen" />
        <link rel="stylesheet" href="rain-voice-note.1003.css" type="text/css" media="screen" />
        <link rel="stylesheet" href="nvccm.css" type="text/css" media="screen" />
        
    </head>

    <body onload="">
        <div id="aiFaceOverlay"></div>
        <div id="contentAll">
                <!----------------------------------------->
                <div class="rainvn">

                    <div class="rainvn_textarea">
                        
                        <button name="micNameGet" id="rainvn_mic_button" class="rainvn_mic_button" onclick="rainvnMicButton(event)" value="starts"><img id="mic_button_img" src="rainvn_mic_button.png" alt="Mic"></button>
                        <div class="rainvn_text nvccm_task">
                            <div class="ai-eye-left"></div>
                            <div class="ai-eye-right"></div>
                            <span id="rainvn_text_final"></span><span id="rainvn_text_interim"></span>
                        </div>
                    </div>

                    <div class="rainvn_footer">                
                        
                    </div>

                </div>
                <!----------------------------------------->

                <div id="nvccm" class="nvccm">
                    <div class="nvccm_item">
                        <button class="nvccm_link" id="nvccm-copy">Copy text</button>
                    </div>
                </div>

                <!----------------------------------------->
                <script type="text/javascript" src="rain-voice-note.1003.js"></script>
                <script type="text/javascript" src="nvccm.js"></script>
            
        </div>

        <div id="footerContent">
        </div>

        <div class="cpR">
        </div>
    </body>

    <!------- Scripts -------->

        // Não inicia automaticamente - será controlado pelo Windows Forms
