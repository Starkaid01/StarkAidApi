<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentação - Starkaid</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background: var(--dark-bg);
            color: var(--light-text);
            min-height: 100vh;
            padding-top: 80px;
        }

        .documentation-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
            min-height: calc(100vh - 100px);
        }

        /* Menu Lateral */
        .docs-sidebar {
            width: 280px;
            background: rgba(20, 20, 30, 0.95);
            padding: 20px;
            border-radius: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            max-height: calc(100vh - 120px);
            position: sticky;
            top: 100px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .docs-sidebar h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .docs-sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .docs-sidebar ul li {
            margin-bottom: 10px;
        }

        .docs-menu-item {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .docs-menu-item:hover {
            background: rgba(0, 255, 247, 0.2);
            color: var(--primary-color);
            transform: translateX(5px);
        }

        .docs-menu-item.active {
            background: rgba(0, 255, 247, 0.2);
            color: var(--primary-color);
        }

        /* Área de Conteúdo */
        .docs-content {
            flex: 1;
            background: rgba(20, 20, 30, 0.8);
            padding: 30px;
            border-radius: 12px;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .docs-content .section {
            margin-bottom: 60px;
            background: rgba(20, 20, 30, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 247, 0.2);
        }

        .docs-content .section h1 {
            color: var(--primary-color);
            font-size: 32px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary-color);
        }

        .docs-content .section h2 {
            color: var(--primary-color);
            font-size: 24px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .docs-content .section h3 {
            color: #00d4ff;
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .docs-content .section p {
            margin-bottom: 15px;
            text-align: justify;
            color: var(--light-text);
            line-height: 1.6;
        }

        .docs-content .section ul,
        .docs-content .section ol {
            margin-left: 30px;
            margin-bottom: 20px;
            color: var(--light-text);
        }

        .docs-content .section ul li,
        .docs-content .section ol li {
            margin-bottom: 10px;
        }

        .docs-content .command-card {
            background: rgba(0, 255, 247, 0.1);
            border: 1px solid rgba(0, 255, 247, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .docs-content .command-card:hover {
            background: rgba(0, 255, 247, 0.2);
            border-color: var(--primary-color);
            transform: translateX(5px);
        }

        .docs-content .command-card h4 {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 10px;
        }

        .docs-content .command-card .command-example {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            color: #00d4ff;
            border-left: 3px solid var(--primary-color);
        }

        .docs-content .command-card .description {
            color: #ccc;
            margin-top: 8px;
        }

        .docs-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.3);
        }

        .docs-content table th {
            background: rgba(0, 255, 247, 0.2);
            color: var(--primary-color);
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(0, 255, 247, 0.3);
        }

        .docs-content table td {
            padding: 12px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--light-text);
        }

        .docs-content table tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }

        .docs-content table tr:hover {
            background: rgba(0, 255, 247, 0.1);
        }

        .docs-content code {
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
        }

        .docs-content pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            border-left: 4px solid var(--primary-color);
            margin: 15px 0;
        }

        .docs-content pre code {
            background: none;
            padding: 0;
            color: #00d4ff;
        }

        .docs-content .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .docs-content .badge-predefined {
            background: var(--primary-color);
            color: #000;
        }

        .docs-content .badge-custom {
            background: #ff6b6b;
            color: #fff;
        }

        .loading-placeholder {
            text-align: center;
            padding: 50px;
            color: var(--light-text);
        }

        .loading-placeholder h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .documentation-container {
                flex-direction: column;
                padding: 10px;
            }

            .docs-sidebar {
                width: 100%;
                position: relative;
                top: 0;
                max-height: 300px;
            }

            .docs-content {
                padding: 20px;
            }
        }

        /* Scrollbar personalizada */
        .docs-sidebar::-webkit-scrollbar,
        .docs-content::-webkit-scrollbar {
            width: 8px;
        }

        .docs-sidebar::-webkit-scrollbar-track,
        .docs-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .docs-sidebar::-webkit-scrollbar-thumb,
        .docs-content::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 247, 0.5);
            border-radius: 4px;
        }

        .docs-sidebar::-webkit-scrollbar-thumb:hover,
        .docs-content::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 247, 0.8);
        }
    </style>
</head>
<body>
    <!-- Menu Hamburger -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>Starkaid</h1>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu" id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="automacao.html">Starkaid Automação</a></li>
                <li><a href="cursos.html">Starkaid Cursos</a></li>
                <li><a href="documentacao.html" class="active">📖 Docs</a></li>
                <li><a href="desenvolvedores.html">💻 Para Desenvolvedores</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </div>
    </nav>

    <!-- Container Principal -->
    <div class="documentation-container">
        <!-- Menu Lateral -->
        <nav class="docs-sidebar">
            <h2>📚 Menu</h2>
            <ul id="docs-menu-list">
                <li>
                    <a href="#" onclick="loadDocContent('software-windows'); return false;" 
                       class="docs-menu-item active" 
                       data-doc="software-windows">
                        🪟 Software Windows
                    </a>
                </li>
                <li>
                    <a href="#" onclick="loadDocContent('app-android'); return false;" 
                       class="docs-menu-item" 
                       data-doc="app-android">
                        📱 App Android
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Área de Conteúdo -->
        <div id="docs-content" class="docs-content">
            <div class="loading-placeholder">
                <h2>Documentação</h2>
                <p>Carregando documentação...</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Função para carregar conteúdo de documentação
        async function loadDocContent(docType) {
            const contentArea = document.getElementById('docs-content');
            const menuItems = document.querySelectorAll('.docs-menu-item');
            
            // Atualizar menu ativo
            menuItems.forEach(item => {
                item.classList.remove('active');
            });
            
            const activeItem = document.querySelector(`[data-doc="${docType}"]`);
            if (activeItem) {
                activeItem.classList.add('active');
            }
            
            // Mostrar loading
            contentArea.innerHTML = `
                <div class="loading-placeholder">
                    <h2>Carregando documentação...</h2>
                    <p>Aguarde enquanto carregamos o conteúdo.</p>
                </div>
            `;
            
            try {
                let contentFile = '';
                
                if (docType === 'software-windows') {
                    contentFile = '/documentacao-content.html';
                } else if (docType === 'app-android') {
                    contentFile = '/documentacao-android-content.html';
                } else {
                    contentArea.innerHTML = `
                        <div class="loading-placeholder">
                            <h2>Documentação não encontrada</h2>
                            <p>Tipo de documentação: ${docType}</p>
                        </div>
                    `;
                    return;
                }
                
                // Carregar documentação
                const response = await fetch(contentFile);
                if (!response.ok) {
                    throw new Error('Documentação não encontrada');
                }
                
                const html = await response.text();
                
                // O arquivo já contém apenas o conteúdo (div.content)
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const content = doc.querySelector('.content') || doc.body;
                
                if (content) {
                    contentArea.innerHTML = content.innerHTML;
                    
                    // Adicionar scroll suave para links internos
                    contentArea.querySelectorAll('a[href^="#"]').forEach(anchor => {
                        anchor.addEventListener('click', function (e) {
                            e.preventDefault();
                            const targetId = this.getAttribute('href').substring(1);
                            const target = contentArea.querySelector(`#${targetId}`);
                            if (target) {
                                target.scrollIntoView({
                                    behavior: 'smooth',
                                    block: 'start'
                                });
                            }
                        });
                    });
                } else {
                    throw new Error('Conteúdo da documentação não encontrado');
                }
            } catch (error) {
                console.error('Erro ao carregar documentação:', error);
                contentArea.innerHTML = `
                    <div class="loading-placeholder">
                        <h2 style="color: var(--error-color);">Erro ao carregar documentação</h2>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="loadDocContent('software-windows')" style="margin-top: 1rem;">Tentar novamente</button>
                    </div>
                `;
            }
        }

        // Carregar documentação ao abrir a página
        document.addEventListener('DOMContentLoaded', () => {
            loadDocContent('software-windows');
        });
    </script>
</body>
</html>
