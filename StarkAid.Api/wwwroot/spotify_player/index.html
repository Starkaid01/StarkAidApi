<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarkAid Spotify Player - Debug</title>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            color: #1DB954; /* Verde Spotify */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .status-panel {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status-item {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }
        .status-label {
            font-weight: bold;
            margin-right: 10px;
            min-width: 120px;
        }
        .status-value {
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            flex-grow: 1;
        }
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }
        button {
            background: #1DB954;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }
        button:active {
            transform: translateY(0);
        }
        .log-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #1DB954;
        }
        .log-entry {
            margin: 5px 0;
            font-family: monospace;
            font-size: 14px;
            padding: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ready {
            color: #1DB954;
        }
        .not-ready {
            color: #ff4d4d;
        }
        .debug {
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <h1>🎵 StarkAid Spotify Player - Debug</h1>
    
    <div class="container">
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="status">Carregando...</span>
            </div>
            <div class="status-item">
                <span class="status-label">User ID:</span>
                <span class="status-value" id="userId">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">Device ID:</span>
                <span class="status-value" id="deviceId">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">Player Ready:</span>
                <span class="status-value" id="playerReady">Não</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="playDemoTrack()">Tocar Música Demo</button>
            <button onclick="pauseTrack()">Parar Música</button>
        </div>

        <div class="log-container">
            <div class="log-title">Log de Eventos:</div>
            <div id="eventLog"></div>
        </div>
    </div>

    <script>
        const userId = new URLSearchParams(window.location.search).get("userId");
        if (!userId) {
            document.getElementById("status").innerText = "Erro: userId não informado!";
            document.getElementById("status").className = "not-ready";
            throw new Error("userId ausente");
        }
        
        document.getElementById("userId").innerText = userId;
        let spotifyPlayer = null;
        window.deviceId = null;
        let isPlayerReady = false;

        // Log de eventos para debug
        function logEvent(message, type = "debug") {
            const logElement = document.getElementById("eventLog");
            const logEntry = document.createElement("div");
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logElement.appendChild(logEntry);
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        async function getAccessToken() {
            try {
                const res = await fetch(`https://starkaid.vbweb.com.br/api/spotifyauth/token?userId=${userId}`);
                if (!res.ok) throw new Error("Falha ao buscar token");
                const data = await res.json();
                return data.accessToken;
            } catch (error) {
                logEvent(`Erro ao obter token: ${error.message}`, "not-ready");
                throw error;
            }
        }

        window.onSpotifyWebPlaybackSDKReady = async () => {
            try {
                logEvent("Spotify Web Playback SDK carregado");
                const token = await getAccessToken();

                spotifyPlayer = new Spotify.Player({
                    name: 'StarkAid Web Player',
                    getOAuthToken: async cb => { 
                        try {
                            const token = await getAccessToken();
                            cb(token);
                        } catch (error) {
                            logEvent(`Erro ao obter token OAuth: ${error.message}`, "not-ready");
                        }
                    },
                    volume: 0.8
                });

                spotifyPlayer.addListener('ready', ({ device_id }) => {
                    logEvent(`Player pronto! DeviceId: ${device_id}`, "ready");
                    document.getElementById("status").innerText = "Player pronto!";
                    document.getElementById("status").className = "ready";
                    document.getElementById("deviceId").innerText = device_id;
                    document.getElementById("playerReady").innerText = "Sim";
                    document.getElementById("playerReady").className = "ready";
                    
                    window.deviceId = device_id;
                    isPlayerReady = true;
                });

                spotifyPlayer.addListener('not_ready', ({ device_id }) => {
                    logEvent(`Player offline: ${device_id}`, "not-ready");
                    isPlayerReady = false;
                    document.getElementById("playerReady").innerText = "Não";
                    document.getElementById("playerReady").className = "not-ready";
                });

                spotifyPlayer.addListener('initialization_error', ({ message }) => {
                    logEvent(`Erro de inicialização: ${message}`, "not-ready");
                });

                spotifyPlayer.addListener('authentication_error', ({ message }) => {
                    logEvent(`Erro de autenticação: ${message}`, "not-ready");
                });

                spotifyPlayer.addListener('account_error', ({ message }) => {
                    logEvent(`Erro de conta: ${message}`, "not-ready");
                });

                spotifyPlayer.addListener('playback_error', ({ message }) => {
                    logEvent(`Erro de reprodução: ${message}`, "not-ready");
                });

                // Estado de reprodução
                spotifyPlayer.addListener('player_state_changed', state => {
                    if (!state) return;
                    logEvent(`Estado alterado: ${state.paused ? 'Pausado' : 'Reproduzindo'}`, "debug");
                });

                await spotifyPlayer.connect();
                logEvent("Conectando ao player...");
            } catch (err) {
                logEvent(`Erro: ${err.message}`, "not-ready");
                document.getElementById("status").innerText = "Erro: " + err.message;
                document.getElementById("status").className = "not-ready";
            }
        };

        // Função para tocar música
        window.playTrack = async function(trackUri) {
            if (!isPlayerReady || !window.deviceId) {
                logEvent("Player ainda não pronto para tocar", "not-ready");
                return "not_ready";
            }

            try {
                const token = await getAccessToken();
                logEvent(`Solicitando reprodução: ${trackUri}`);
                
                const response = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${window.deviceId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ uris: [trackUri] })
                });

                if (response.status === 204) {
                    logEvent("Música iniciada com sucesso!", "ready");
                    return "playing";
                } else {
                    const errorData = await response.text();
                    logEvent(`Erro na reprodução: ${response.status} - ${errorData}`, "not-ready");
                    return "error";
                }
            } catch (err) {
                logEvent(`Exceção ao tocar: ${err.message}`, "not-ready");
                return "error";
            }
        };

        // Função para pausar música
       // Função para pausar música via Web API
        window.pauseTrack = async function() {
            if (!window.deviceId) {
            console.log("Device ainda não pronto, tentando em 500ms");
            return "not_ready";
            }

            try {
            const token = await getAccessToken();
            await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${window.deviceId}`, {
                method: "PUT",
                headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
                }
            });
            console.log("Música pausada com sucesso!");
            return "paused";
            } catch (err) {
            console.error("Erro ao pausar música:", err);
            return "error";
            }
        };

        // Função auxiliar para tocar uma música de demo
        function playDemoTrack() {
            playTrack('spotify:track:3nI0piSOxAik2RCpHGloB7');
        }

        // Inicialização
        logEvent("Página carregada, aguardando SDK do Spotify...");
    </script>
</body>
</html>
