<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | StarkAid</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/resetpassword.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Redefinir Senha</h1>
            <p>Digite sua nova senha abaixo</p>
        </div>

        <div class="content">
            <form id="resetForm">
                <input type="hidden" id="token" value="">

                <div class="form-group">
                    <label for="newPassword">Nova senha:</label>
                    <div class="input-with-icon">
                        <i class="fas fa-key"></i>
                        <input type="password" id="newPassword" placeholder="Digite sua nova senha" required>
                        <span class="password-toggle" id="togglePassword1">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="repeatNewPassword">Repita a nova senha:</label>
                    <div class="input-with-icon">
                        <i class="fas fa-redo"></i>
                        <input type="password" id="repeatNewPassword" placeholder="Repita sua nova senha" required>
                        <span class="password-toggle" id="togglePassword2">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                    <div id="passwordMatch" style="color: var(--error-color); font-size: 14px; margin-top: 5px; display: none;">
                        <i class="fas fa-exclamation-circle"></i> As senhas não coincidem
                    </div>
                </div>

                <button type="submit" class="btn">Redefinir Senha</button>

                <div id="resultado"></div>
            </form>
        </div>

        <div class="footer">
            <p>© 2023 StarkAid. Todos os direitos reservados. <a href="#">Política de Privacidade</a></p>
        </div>
    </div>

    <script>
        // Pegar token da URL
        const params = new URLSearchParams(window.location.search);
        document.getElementById("token").value = params.get("token");

        // Referências aos elementos
        const newPassword = document.getElementById('newPassword');
        const repeatNewPassword = document.getElementById('repeatNewPassword');
        const passwordMatch = document.getElementById('passwordMatch');
        const resultado = document.getElementById('resultado');
        const togglePassword1 = document.getElementById('togglePassword1');
        const togglePassword2 = document.getElementById('togglePassword2');

        // Alternar visibilidade da senha
        function togglePasswordVisibility(inputId, toggleId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(toggleId);

            if (input.type === 'password') {
                input.type = 'text';
                toggle.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                toggle.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }

        togglePassword1.addEventListener('click', () => togglePasswordVisibility('newPassword', 'togglePassword1'));
        togglePassword2.addEventListener('click', () => togglePasswordVisibility('repeatNewPassword', 'togglePassword2'));

        // Verificar se as senhas coincidem
        repeatNewPassword.addEventListener('input', function () {
            if (this.value !== newPassword.value && this.value !== '') {
                passwordMatch.style.display = 'block';
            } else {
                passwordMatch.style.display = 'none';
            }
        });

        // Enviar formulário (funcionalidade original mantida)
        document.getElementById("resetForm").addEventListener("submit", async e => {
            e.preventDefault();

            // Resetar mensagem de resultado
            resultado.className = '';
            resultado.textContent = '';

            // Validações
            const token = document.getElementById("token").value;
            const newPass = newPassword.value;
            const repeatPass = repeatNewPassword.value;

            // Verificar se as senhas coincidem
            if (newPass !== repeatPass) {
                resultado.textContent = 'As senhas não coincidem.';
                resultado.className = 'error';
                return;
            }

            // Mostrar mensagem de processamento
            resultado.textContent = 'Processando...';
            resultado.className = '';

            try {
                const res = await fetch("/api/v1/Users/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, newPassword: newPass, repeatNewPassword: repeatPass })
                });

                const msg = await res.text();

                if (res.ok) {
                    resultado.textContent = 'Sua senha foi redefinida com sucesso! feche esta pagina e volte ao App para fazer login.';
                    resultado.className = 'success';

                    // Redirecionar após 3 segundos
                    //setTimeout(() => {
                    //    window.location.href = '/login.html';
                    //}, 3000);
                } else {
                    resultado.textContent = msg;
                    resultado.className = 'error';
                }

            } catch (error) {
                resultado.textContent = 'Ocorreu um erro ao processar sua solicitação. Tente novamente mais tarde.';
                resultado.className = 'error';
            }
        });
    </script>
</body>
</html>
