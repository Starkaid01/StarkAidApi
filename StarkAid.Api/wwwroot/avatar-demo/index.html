<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StarkAvatar Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 30% 20%, rgba(120, 90, 255, 0.18), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(87, 247, 255, 0.10), transparent 55%),
        linear-gradient(180deg, #070a18, #02030a 72%, #000 100%);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      transform: translateZ(0);
      background-repeat: repeat;
      z-index: 0;
    }

    body::before {
      opacity: 0.82;
      background-size: 320px 320px;
      background-image:
        radial-gradient(1px 1px at 18px 38px, rgba(255,255,255,0.85), transparent 2px),
        radial-gradient(1px 1px at 128px 26px, rgba(255,255,255,0.62), transparent 2px),
        radial-gradient(1.2px 1.2px at 210px 86px, rgba(255,255,255,0.78), transparent 2.4px),
        radial-gradient(1px 1px at 302px 54px, rgba(255,255,255,0.72), transparent 2px),
        radial-gradient(1.4px 1.4px at 276px 118px, rgba(210,245,255,0.68), transparent 3px),
        radial-gradient(1px 1px at 72px 110px, rgba(255,255,255,0.58), transparent 2px),
        radial-gradient(1.3px 1.3px at 46px 150px, rgba(255,255,255,0.74), transparent 2.6px),
        radial-gradient(1px 1px at 190px 160px, rgba(255,255,255,0.52), transparent 2px),
        radial-gradient(1.1px 1.1px at 312px 172px, rgba(255,255,255,0.64), transparent 2.2px),
        radial-gradient(1px 1px at 130px 198px, rgba(255,255,255,0.56), transparent 2px),
        radial-gradient(1.6px 1.6px at 246px 214px, rgba(255,255,255,0.88), transparent 3.2px),
        radial-gradient(1px 1px at 18px 222px, rgba(255,255,255,0.46), transparent 2px),
        radial-gradient(1.2px 1.2px at 84px 238px, rgba(180,200,255,0.55), transparent 2.4px),
        radial-gradient(1px 1px at 300px 252px, rgba(255,255,255,0.60), transparent 2px),
        radial-gradient(1.4px 1.4px at 162px 266px, rgba(255,255,255,0.80), transparent 3px),
        radial-gradient(1px 1px at 52px 286px, rgba(255,255,255,0.50), transparent 2px),
        radial-gradient(1.3px 1.3px at 254px 296px, rgba(255,255,255,0.68), transparent 2.6px),
        radial-gradient(1px 1px at 118px 312px, rgba(255,255,255,0.54), transparent 2px),
        radial-gradient(1.7px 1.7px at 292px 312px, rgba(255,255,255,0.92), transparent 3.4px),
        radial-gradient(1px 1px at 28px 320px, rgba(255,255,255,0.64), transparent 2px),
        radial-gradient(1.2px 1.2px at 204px 316px, rgba(255,235,210,0.56), transparent 2.6px),
        radial-gradient(1px 1px at 90px 60px, rgba(255,255,255,0.48), transparent 2px);
      animation: driftA 105s linear infinite;
    }

    body::after {
      opacity: 0.46;
      background-size: 840px 840px;
      filter: blur(0.35px);
      background-image:
        radial-gradient(2px 2px at 110px 140px, rgba(255,255,255,0.28), transparent 3px),
        radial-gradient(2.2px 2.2px at 520px 90px, rgba(255,255,255,0.24), transparent 3.4px),
        radial-gradient(2px 2px at 620px 420px, rgba(255,255,255,0.20), transparent 3px),
        radial-gradient(2.4px 2.4px at 260px 620px, rgba(255,255,255,0.26), transparent 3.8px),
        radial-gradient(2px 2px at 40px 520px, rgba(255,255,255,0.18), transparent 3px),
        radial-gradient(2px 2px at 700px 650px, rgba(255,255,255,0.16), transparent 3px),
        radial-gradient(2.6px 2.6px at 360px 360px, rgba(255,255,255,0.22), transparent 4px),
        radial-gradient(2px 2px at 780px 180px, rgba(180,225,255,0.16), transparent 3px),
        radial-gradient(2.2px 2.2px at 120px 780px, rgba(255,255,255,0.14), transparent 3.2px),
        radial-gradient(2.8px 2.8px at 420px 740px, rgba(255,240,220,0.15), transparent 4.2px),
        radial-gradient(2.2px 2.2px at 800px 520px, rgba(255,255,255,0.13), transparent 3.2px),
        radial-gradient(2.6px 2.6px at 560px 560px, rgba(255,255,255,0.16), transparent 4px);
      animation: driftB 175s linear infinite;
    }

    @keyframes driftA {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-320px, 320px, 0); }
    }

    @keyframes driftB {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(840px, -840px, 0); }
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 38%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 62%, rgba(0,0,0,0.90) 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-repeat: no-repeat;
      mix-blend-mode: screen;
      opacity: 0.62;
      filter: blur(0.45px);
      background-image:
        radial-gradient(circle at 52% 34%, rgba(255,255,255,0.92) 0 2.2px, transparent 5px),
        radial-gradient(circle at 46% 41%, rgba(210,245,255,0.72) 0 1.9px, transparent 5px),
        radial-gradient(circle at 56% 44%, rgba(255,240,215,0.66) 0 1.8px, transparent 5px),
        radial-gradient(circle at 48% 50%, rgba(255,255,255,0.62) 0 1.6px, transparent 4.6px),
        radial-gradient(circle at 60% 52%, rgba(180,210,255,0.52) 0 1.5px, transparent 4.4px),
        radial-gradient(circle at 44% 57%, rgba(255,255,255,0.48) 0 1.4px, transparent 4.2px),
        radial-gradient(circle at 58% 60%, rgba(210,245,255,0.44) 0 1.3px, transparent 4px);
      animation: twinkle 7.5s ease-in-out infinite;
    }

    @keyframes twinkle {
      0% { opacity: 0.46; transform: translate3d(0, 0, 0); }
      45% { opacity: 0.78; }
      100% { opacity: 0.56; transform: translate3d(0.6%, -0.4%, 0); }
    }

    .canvas-wrap {
      width: min(560px, calc(100vw - 48px));
      aspect-ratio: 1 / 1.25;
      position: relative;
      z-index: 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      background: transparent;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="/lib/signalr/signalr.min.js"></script>
</head>
<body>
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="stark-avatar-canvas"></canvas>
    </div>
  </div>

  <script>
    window.StarkAvatar3D = (() => {
      const instances = new Map();

      const createId = () => {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        return `stark-${Math.random().toString(16).slice(2)}-${Date.now().toString(16)}`;
      };

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const create = (canvasId, size, speaking) => {
        const canvas = document.getElementById(canvasId);
        if (!canvas || !window.BABYLON) {
          return "";
        }

        const id = createId();
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: false, stencil: true, premultipliedAlpha: true, adaptToDeviceRatio: true });
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

        const applyDpr = () => {
          const dpr = window.devicePixelRatio || 1;
          engine.setHardwareScalingLevel(1 / dpr);
        };
        applyDpr();

        const camera = new BABYLON.FreeCamera("cam", new BABYLON.Vector3(0, 0, -10), scene);
        camera.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
        camera.setTarget(BABYLON.Vector3.Zero());
        camera.minZ = 0.1;
        camera.maxZ = 100;
        camera.detachControl();

        let viewHalfW = 1;
        let viewHalfH = 1;
        const updateCameraOrtho = () => {
          const w = canvas.clientWidth || canvas.width || 1;
          const h = canvas.clientHeight || canvas.height || 1;
          const aspect = w / h;
          const orthoHeight = 3.6;
          const halfH = orthoHeight / 2;
          const halfW = halfH * aspect;
          viewHalfW = halfW;
          viewHalfH = halfH;
          camera.orthoLeft = -halfW;
          camera.orthoRight = halfW;
          camera.orthoTop = halfH;
          camera.orthoBottom = -halfH;
        };
        updateCameraOrtho();

        const glowLayer = new BABYLON.GlowLayer("glow", scene, { blurKernelSize: 24 });
        glowLayer.intensity = 0.62;

        const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
        pipeline.fxaaEnabled = true;
        pipeline.bloomEnabled = true;
        pipeline.bloomThreshold = 0.62;
        pipeline.bloomWeight = 0.14;
        pipeline.bloomKernel = 32;
        pipeline.bloomScale = 0.55;

        const root = new BABYLON.TransformNode("root", scene);
        root.position.y = 0.05;

        const rand = (min, max) => min + Math.random() * (max - min);
        const smoothstep = (edge0, edge1, x) => {
          const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
          return t * t * (3 - 2 * t);
        };

        const insideBust = (x, y) => {
          const inHead = ((x / 0.68) ** 2 + ((y - 1.55) / 0.86) ** 2) <= 1.0;
          const inShoulders = ((x / 1.75) ** 2 + ((y - 0.2) / 1.25) ** 2) <= 1.0;
          const inTorso = ((x / 1.25) ** 2 + ((y + 0.75) / 1.55) ** 2) <= 1.0;
          const inNeck = Math.abs(x) <= (0.26 + 0.18 * smoothstep(0.85, 1.2, y)) && y >= 0.8 && y <= 1.35;
          return inHead || (inShoulders && y <= 1.25) || (inTorso && y <= 1.05) || inNeck;
        };

        const sampleInBust = () => {
          for (let i = 0; i < 80; i++) {
            const x = rand(-1.85, 1.85);
            const y = rand(-1.25, 2.45);
            if (insideBust(x, y)) return { x, y };
          }
          return { x: 0, y: 0 };
        };

        const polylineLengths = (poly) => {
          const seg = [];
          let total = 0;
          for (let i = 1; i < poly.length; i++) {
            const dx = poly[i].x - poly[i - 1].x;
            const dy = poly[i].y - poly[i - 1].y;
            const len = Math.hypot(dx, dy);
            seg.push(len);
            total += len;
          }
          return { seg, total };
        };

        const samplePolyline = (poly, meta, t) => {
          const dist = t * meta.total;
          let acc = 0;
          for (let i = 0; i < meta.seg.length; i++) {
            const len = meta.seg[i];
            if (acc + len >= dist) {
              const u = (dist - acc) / (len || 1);
              const a = poly[i];
              const b = poly[i + 1];
              return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
            }
            acc += len;
          }
          return poly[poly.length - 1];
        };

        const createDots = (name, count, initParticle, material, parent) => {
          const dot = BABYLON.MeshBuilder.CreatePlane(`${name}-dot`, { size: 0.026 }, scene);
          dot.isVisible = false;
          const sps = new BABYLON.SolidParticleSystem(name, scene, { updatable: true });
          sps.addShape(dot, count);
          const mesh = sps.buildMesh();
          dot.dispose();
          mesh.parent = parent;
          mesh.material = material;
          mesh.isPickable = false;
          mesh.alwaysSelectAsActiveMesh = true;
          for (let i = 0; i < sps.nbParticles; i++) {
            initParticle(sps.particles[i], i);
          }
          sps.setParticles();
          return { sps, mesh };
        };

        const matBody = new BABYLON.StandardMaterial("matBody", scene);
        matBody.disableLighting = true;
        matBody.emissiveColor = new BABYLON.Color3(0.06, 0.07, 0.085);
        matBody.alpha = 0.68;
        matBody.alphaMode = BABYLON.Constants.ALPHA_COMBINE;

        const matRed = new BABYLON.StandardMaterial("matRed", scene);
        matRed.disableLighting = true;
        matRed.emissiveColor = new BABYLON.Color3(1.0, 0.1, 0.1);
        matRed.alpha = 0.85;
        matRed.alphaMode = BABYLON.Constants.ALPHA_ADD;

        const matGold = new BABYLON.StandardMaterial("matGold", scene);
        matGold.disableLighting = true;
        matGold.emissiveColor = new BABYLON.Color3(1.0, 0.72, 0.22);
        matGold.alpha = 0.75;
        matGold.alphaMode = BABYLON.Constants.ALPHA_ADD;

        const matReactorCyan = new BABYLON.StandardMaterial("matReactorCyan", scene);
        matReactorCyan.disableLighting = true;
        matReactorCyan.emissiveColor = new BABYLON.Color3(0.25, 0.95, 1.0);
        matReactorCyan.alpha = 0.9;
        matReactorCyan.alphaMode = BABYLON.Constants.ALPHA_ADD;

        const matDustCyan = new BABYLON.StandardMaterial("matDustCyan", scene);
        matDustCyan.disableLighting = true;
        matDustCyan.emissiveColor = new BABYLON.Color3(0.16, 0.55, 0.65);
        matDustCyan.alpha = 0.16;
        matDustCyan.alphaMode = BABYLON.Constants.ALPHA_ADD;

        const matEyeWhite = new BABYLON.StandardMaterial("matEyeWhite", scene);
        matEyeWhite.disableLighting = true;
        matEyeWhite.emissiveColor = new BABYLON.Color3(0.95, 0.98, 1.0);
        matEyeWhite.alpha = 0.95;
        matEyeWhite.alphaMode = BABYLON.Constants.ALPHA_ADD;

        const body = createDots(
          "body",
          2600,
          (p) => {
            const pt = sampleInBust();
            p.position.x = pt.x + rand(-0.02, 0.02);
            p.position.y = pt.y + rand(-0.02, 0.02);
            p.position.z = rand(-0.02, 0.02);
            const s = rand(0.55, 1.05);
            p.scaling.x = s;
            p.scaling.y = s * rand(0.9, 1.15);
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matBody,
          root
        );

        const outline = [
          { x: -1.05, y: -1.05 },
          { x: -1.45, y: -0.4 },
          { x: -1.65, y: 0.25 },
          { x: -1.25, y: 0.9 },
          { x: -0.7, y: 1.18 },
          { x: -0.5, y: 1.95 },
          { x: 0.0, y: 2.35 },
          { x: 0.5, y: 1.95 },
          { x: 0.7, y: 1.18 },
          { x: 1.25, y: 0.9 },
          { x: 1.65, y: 0.25 },
          { x: 1.45, y: -0.4 },
          { x: 1.05, y: -1.05 }
        ];
        const outlineMeta = polylineLengths(outline);

        const redLines = createDots(
          "redLines",
          1300,
          (p, i) => {
            const t = (i + Math.random()) / 1300;
            const pt = samplePolyline(outline, outlineMeta, t);
            const jitter = rand(-0.03, 0.03);
            p.position.x = pt.x + jitter;
            p.position.y = pt.y + rand(-0.03, 0.03);
            p.position.z = rand(-0.02, 0.02);
            const s = rand(0.7, 1.25);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matRed,
          root
        );
        glowLayer.addIncludedOnlyMesh(redLines.mesh);

        const faceOutline = [
          { x: -0.55, y: 1.95 },
          { x: -0.42, y: 1.45 },
          { x: -0.3, y: 1.15 },
          { x: 0.0, y: 1.05 },
          { x: 0.3, y: 1.15 },
          { x: 0.42, y: 1.45 },
          { x: 0.55, y: 1.95 }
        ];
        const faceMeta = polylineLengths(faceOutline);

        const goldLines = createDots(
          "goldLines",
          760,
          (p, i) => {
            const t = (i + Math.random()) / 760;
            const pt = samplePolyline(faceOutline, faceMeta, t);
            p.position.x = pt.x + rand(-0.02, 0.02);
            p.position.y = pt.y + rand(-0.02, 0.02);
            p.position.z = rand(-0.02, 0.02);
            const s = rand(0.75, 1.35);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matGold,
          root
        );
        glowLayer.addIncludedOnlyMesh(goldLines.mesh);

        const chestLines = [
          { x: -0.95, y: 0.35 },
          { x: -0.35, y: -0.25 },
          { x: 0.0, y: -0.55 },
          { x: 0.35, y: -0.25 },
          { x: 0.95, y: 0.35 }
        ];
        const chestMeta = polylineLengths(chestLines);
        const chestNeon = createDots(
          "chestNeon",
          540,
          (p, i) => {
            const t = (i + Math.random()) / 540;
            const pt = samplePolyline(chestLines, chestMeta, t);
            p.position.x = pt.x + rand(-0.03, 0.03);
            p.position.y = pt.y + rand(-0.03, 0.03);
            p.position.z = rand(-0.02, 0.02);
            const s = rand(0.7, 1.2);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matRed,
          root
        );
        glowLayer.addIncludedOnlyMesh(chestNeon.mesh);

        const eyesRoot = new BABYLON.TransformNode("eyesRoot", scene);
        eyesRoot.parent = root;
        const leftEye = [
          { x: -0.32, y: 1.65 },
          { x: -0.08, y: 1.62 }
        ];
        const rightEye = [
          { x: 0.32, y: 1.65 },
          { x: 0.08, y: 1.62 }
        ];
        const leftEyeMeta = polylineLengths(leftEye);
        const rightEyeMeta = polylineLengths(rightEye);

        const eyes = createDots(
          "eyes",
          180,
          (p, i) => {
            const isLeft = i < 90;
            const j = isLeft ? i : (i - 90);
            const t = (j + Math.random()) / 90;
            const pt = samplePolyline(isLeft ? leftEye : rightEye, isLeft ? leftEyeMeta : rightEyeMeta, t);
            p.position.x = pt.x + rand(-0.01, 0.01);
            p.position.y = pt.y + rand(-0.01, 0.01);
            p.position.z = rand(-0.01, 0.01);
            const s = rand(1.05, 1.6);
            p.scaling.x = s;
            p.scaling.y = s * rand(0.7, 1.05);
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matEyeWhite,
          eyesRoot
        );
        glowLayer.addIncludedOnlyMesh(eyes.mesh);

        const reactorRoot = new BABYLON.TransformNode("reactorRoot", scene);
        reactorRoot.parent = root;
        reactorRoot.position.y = -0.05;

        const reactorRing = createDots(
          "reactorRing",
          420,
          (p, i) => {
            const a = (i / 420) * Math.PI * 2;
            const r = 0.36 + rand(-0.01, 0.01);
            p.position.x = Math.cos(a) * r;
            p.position.y = Math.sin(a) * r;
            p.position.z = rand(-0.01, 0.01);
            const s = rand(0.8, 1.4);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matReactorCyan,
          reactorRoot
        );
        glowLayer.addIncludedOnlyMesh(reactorRing.mesh);

        const reactorCore = createDots(
          "reactorCore",
          640,
          (p) => {
            const a = rand(0, Math.PI * 2);
            const rr = Math.sqrt(Math.random()) * 0.22;
            p.position.x = Math.cos(a) * rr;
            p.position.y = Math.sin(a) * rr;
            p.position.z = rand(-0.01, 0.01);
            const s = rand(0.85, 1.55);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matReactorCyan,
          reactorRoot
        );
        glowLayer.addIncludedOnlyMesh(reactorCore.mesh);

        const reactorSpokes = createDots(
          "reactorSpokes",
          220,
          (p, i) => {
            const t = (i + Math.random()) / 220;
            const axis = t < 0.5 ? 0 : Math.PI / 2;
            const u = (t < 0.5 ? t : (t - 0.5)) * 2;
            const x = (u - 0.5) * 0.62;
            const y = 0;
            const ca = Math.cos(axis);
            const sa = Math.sin(axis);
            p.position.x = x * ca - y * sa + rand(-0.01, 0.01);
            p.position.y = x * sa + y * ca + rand(-0.01, 0.01);
            p.position.z = rand(-0.01, 0.01);
            const s = rand(0.75, 1.25);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matReactorCyan,
          reactorRoot
        );
        glowLayer.addIncludedOnlyMesh(reactorSpokes.mesh);

        const dust = createDots(
          "dust",
          1200,
          (p) => {
            const x = rand(-viewHalfW * 1.08, viewHalfW * 1.08);
            const y = rand(-viewHalfH * 1.08, viewHalfH * 1.08);
            const z = rand(-0.06, 0.06);
            p.position.set(x, y, z);
            const s = rand(0.35, 0.9);
            p.scaling.x = s;
            p.scaling.y = s;
            p.scaling.z = 1;
            p.rotation.z = rand(0, Math.PI * 2);
          },
          matDustCyan,
          root
        );
        glowLayer.addIncludedOnlyMesh(dust.mesh);

        const randomizeDust = () => {
          const hw = viewHalfW * 1.08;
          const hh = viewHalfH * 1.08;
          for (let i = 0; i < dust.sps.nbParticles; i++) {
            const p = dust.sps.particles[i];
            p.position.x = rand(-hw, hw);
            p.position.y = rand(-hh, hh);
            p.position.z = rand(-0.06, 0.06);
          }
          dust.sps.setParticles();
        };

        const state = {
          id,
          engine,
          scene,
          root,
          updateCameraOrtho,
          applyDpr,
          randomizeDust,
          glowLayer,
          pipeline,
          mats: { matRed, matGold, matReactorCyan, matEyeWhite, matBody },
          nodes: { reactorRoot },
          speaking: !!speaking,
          speakLevel: !!speaking ? 1 : 0,
          blinkUntil: 0,
          nextBlinkAt: rand(0.6, 1.4),
          t: 0
        };

        scene.onBeforeRenderObservable.add(() => {
          const dt = engine.getDeltaTime() / 1000;
          state.t += dt;

          const target = state.speaking ? 1 : 0;
          state.speakLevel = clamp(state.speakLevel + (target - state.speakLevel) * (1 - Math.exp(-dt * 10)), 0, 1);

          const amp = state.speakLevel;

          const talk = 0.75 + 0.25 * Math.sin(state.t * 13.0);
          const reactorPulse = 1.0 + (1.35 * amp * (0.55 + 0.45 * Math.sin(state.t * 14.0)));
          const reactorGain = 0.68 + 0.32 * amp;
          const eyePulse = 1.0;

          const blinkCadenceMin = state.speaking ? 0.9 : 2.2;
          const blinkCadenceMax = state.speaking ? 1.6 : 4.2;
          if (state.t >= state.nextBlinkAt) {
            state.blinkUntil = state.t + rand(0.08, 0.12);
            state.nextBlinkAt = state.t + rand(blinkCadenceMin, blinkCadenceMax);
          }

          const blinking = state.t < state.blinkUntil;
          state.mats.matEyeWhite.alpha = blinking ? 0.12 : 0.95;

          const reactorLevel = reactorGain * reactorPulse;
          state.mats.matReactorCyan.emissiveColor.set(0.35 * reactorLevel, 1.25 * reactorLevel, 1.6 * reactorLevel);
          state.mats.matReactorCyan.alpha = clamp((0.62 + 0.28 * amp) + (0.04 * amp * Math.sin(state.t * 14.0)), 0.35, 0.92);
          state.mats.matEyeWhite.emissiveColor.set(0.95 * eyePulse, 0.98 * eyePulse, 1.0 * eyePulse);

          state.glowLayer.intensity = 0.58 + 0.2 * amp;
          state.pipeline.bloomWeight = 0.14 + 0.1 * amp;
          state.pipeline.bloomScale = 0.55 + 0.12 * amp;

          state.nodes.reactorRoot.rotation.z = 0;
          state.nodes.reactorRoot.scaling.setAll(1.0 + 0.08 * amp + 0.08 * amp * Math.abs(Math.sin(state.t * 14.0)));
          state.root.position.y = 0.05 + 0.03 * Math.sin(state.t * 1.0);
        });

        engine.runRenderLoop(() => {
          scene.render();
        });

        setTimeout(() => {
          try {
            engine.resize();
            updateCameraOrtho();
            applyDpr();
            randomizeDust();
          } catch {
          }
        }, 0);
        instances.set(id, state);
        return id;
      };

      const setSpeaking = (instanceId, speaking) => {
        const state = instances.get(instanceId);
        if (!state) return;
        state.speaking = !!speaking;
      };

      const dispose = (instanceId) => {
        const state = instances.get(instanceId);
        if (!state) return;
        try {
          state.engine.stopRenderLoop();
          state.scene.dispose();
          state.engine.dispose();
        } finally {
          instances.delete(instanceId);
        }
      };

      window.addEventListener("resize", () => {
        for (const state of instances.values()) {
          try {
            if (typeof state.applyDpr === "function") {
              state.applyDpr();
            }
            state.engine.resize();
            if (typeof state.updateCameraOrtho === "function") {
              state.updateCameraOrtho();
            }
            if (typeof state.randomizeDust === "function") {
              state.randomizeDust();
            }
          } catch {
          }
        }
      });

      return { create, setSpeaking, dispose };
    })();
  </script>

  <script>
    const qs = new URLSearchParams(location.search);
    const sessionId = (qs.get('session') || 'default').trim() || 'default';

    const canvasId = 'stark-avatar-canvas';
    const instanceId = window.StarkAvatar3D.create(canvasId, 360, false);

    function setSpeaking(isSpeaking) {
      if (!instanceId) return;
      window.StarkAvatar3D.setSpeaking(instanceId, !!isSpeaking);
    }

    let activeUtterance = null;

    function estimateMs(text) {
      const t = String(text || '');
      const words = t.trim().split(/\s+/).filter(Boolean).length;
      return Math.max(1200, Math.min(12000, words * 380));
    }

    function stopSpeaking() {
      activeUtterance = null;
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
        } catch {
        }
      }
      setSpeaking(false);
    }

    function isStopCommand(text) {
      const raw = String(text || '').trim().toLowerCase();
      if (!raw) return false;
      if (raw === 'paredefalar' || raw === 'pare de falar' || raw === 'parar' || raw === 'pare') return true;
      const compact = raw.replace(/[^a-z0-9]/g, '');
      return compact === 'paredefalar' || compact === 'ttsstop' || compact === 'stop';
    }

    function speakText(text) {
      const safeText = String(text || '').trim();
      if (!safeText) return;

      if (isStopCommand(safeText)) {
        stopSpeaking();
        return;
      }

      if (!('speechSynthesis' in window)) {
        setSpeaking(true);
        setTimeout(() => setSpeaking(false), estimateMs(safeText));
        return;
      }

      stopSpeaking();
      const utterance = new SpeechSynthesisUtterance(safeText);
      activeUtterance = utterance;
      utterance.lang = 'pt-BR';
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.onstart = () => {
        if (activeUtterance === utterance) setSpeaking(true);
      };
      utterance.onend = () => {
        if (activeUtterance === utterance) {
          activeUtterance = null;
          setSpeaking(false);
        }
      };
      utterance.onerror = () => {
        if (activeUtterance === utterance) {
          activeUtterance = null;
          setSpeaking(false);
        }
      };
      window.speechSynthesis.speak(utterance);
    }

    async function connect() {
      const connection = new signalR.HubConnectionBuilder()
        .withUrl(`/hubs/avatar?session=${encodeURIComponent(sessionId)}`)
        .withAutomaticReconnect()
        .build();

      connection.on('AnimateFromText', (text) => {
        const safeText = String(text || '');
        if (isStopCommand(safeText)) {
          stopSpeaking();
          return;
        }
        speakText(safeText);
      });

      connection.on('Stop', () => stopSpeaking());
      connection.on('StopSpeaking', () => stopSpeaking());
      connection.on('AvatarStop', () => stopSpeaking());

      await connection.start();
    }

    connect().catch(() => { });
  </script>
</body>
