<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <title>Conectando à eWeLink...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f8f9fa;
            color: #333;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h2>Finalizando conexão com eWeLink...</h2>
    <div class="spinner"></div>
    <p>Aguarde enquanto concluímos a autenticação.</p>

    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const region = params.get('region') || 'as'; // Pega a região da URL ou usa 'as' como fallback
            const error = params.get('error');

            if (error) {
                document.body.innerHTML = `<h3 style="color:red">Erro na autenticação: ${error}</h3>`;
                return;
            }

            if (!code) {
                document.body.innerHTML = '<h3 style="color:red">Erro: código de autorização não recebido.</h3>';
                return;
            }

            try {
                // Recuperar token e api-key do localStorage (definidos no login do Blazor)
                const token = localStorage.getItem('token');
                const apiKey = localStorage.getItem('apiKey');

                if (!token) {
                    document.body.innerHTML = '<h3 style="color:red">Erro: Usuário não autenticado no StarkAid.</h3>';
                    return;
                }

                const apiUrl = 'https://starkaid.runasp.net/api/v1/Ewelink/login';
                console.log('Enviando código para a API:', apiUrl, 'Região:', region);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Api-Key': apiKey || ''
                    },
                    body: JSON.stringify({
                        Code: code,
                        Region: region
                    })
                });

                if (response.ok) {
                    // Sucesso! Redireciona para a página eWeLink no frontend
                    window.location.href = '/ewelink';
                } else {
                    const errorData = await response.json().catch(() => ({ message: 'Erro desconhecido' }));
                    const msg = errorData.message || await response.text();
                    document.body.innerHTML = `<h3 style="color:red">Erro ao conectar com eWeLink:</h3><p>${msg}</p>`;
                }
            } catch (err) {
                console.error('Erro de rede:', err);
                document.body.innerHTML = `<h3 style="color:red">Erro de rede:</h3><p>${err.message}</p>`;
            }
        })();
    </script>
</body>

</html>
